<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h2>Iniciar Sesión</h2>

    <form id="loginForm">

        <input 
            type="text" 
            id="loginUsername"
            placeholder="Usuario"
            required
        >

        <input 
            type="password" 
            id="loginPassword"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Ingresar
        </button>
        <p>
    ¿No tienes cuenta?
    <a href="register.html">Registrarse</a>
</p>

    </form>

    <script src="js/auth.js"></script>

</body>
</html>
